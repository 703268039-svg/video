<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>视频</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0d0d0f;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  video {
    width: 100%;
    max-height: 100%;
    background: #000;
    outline: none;
  }
</style>
</head>
<body>
<video src="video.mp4" controls playsinline autoplay muted loop></video>
</body>
</html>
